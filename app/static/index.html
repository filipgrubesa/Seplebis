<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <div class="container">
        <div class="row">
            <button id="signupbutton" onclick="signup()" style="position: fixed; width: 100%; text-align: center; top: 25%;">CREATE AN ACCOUNT</button>
            <a hidden id="message" style="position: fixed; width: 100%; text-align: center; top: 25%;">ACCOUNT CREATED</button>
            <a id="signup" style="position: fixed; width: 100%; text-align: center; top: 27%;" hidden>Your data: username is (), password is ().</a>
            <a style="position: fixed; width: 100%; text-align: center; top: 45%;">OR</a>
        </div>
        <div class="row" style="position: fixed; width: 100%; text-align: center; top: 65%;">
            <input type="text" id="username" placeholder="USERNAME" required>
            <input type="password" id="password" placeholder="PASSWORD" required>
            <button class="button" onclick="login()">LOG IN</button>
            <a id="incorrect" hidden>INCORRECT USERNAME OR PASSWORD</a>
        </div>
